# Keeps the free Supabase project awake: it pauses after 7 days with no activity. Once a day this pings it
# (and the same call closes any shift someone forgot to clock out of, after 16 hours).
# The URL and key below are the public ones already in config.js; they can't read or change anyone's data.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 11 * * *'   # every day, 6:17 AM Texas time
  workflow_dispatch:         # lets you press "Run workflow" by hand
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SA. Team's database
        run: |
          curl -fsS -X POST "https://keyuhyjbtcagrtmagjbl.supabase.co/rest/v1/rpc/t_keepalive" \
            -H "apikey: sb_publishable_aidi4nQxzw068dIqsh6RWQ_7Sm2lF1Z" \
            -H "Content-Type: application/json" -d '{}'
